<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Submission - Ferwap Music Entertainment</title>
    <!-- Link to External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-wrapper">

    <!-- 1. BAGIAN LOGO TERPISAH DI ATAS -->
    <div class="logo-section">
        <img src="https://ferwap.com/assets/logo.png" alt="Ferwap Music Logo" class="brand-logo" onerror="this.src='https://ferwap.com/favicon.ico'">
        <span class="brand-subtext">FERWAP MUSIC</span>
    </div>

    <!-- 2. KOTAK FORMULIR UTAMA -->
    <div class="form-container">
        <div class="header">
            <h1>Ferwap Music Entertainment</h1>
            <p>Talent Scouting & Demo Submission Portal</p>
        </div>

        <!-- Form terhubung ke Formspree -->
        <form id="talentForm" action="https://formspree.io/f/xbjny..." method="POST">
            
            <!-- Musician Information -->
            <div class="row">
                <div class="col form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="As shown on official ID" required>
                </div>
                <div class="col form-group">
                    <label for="stageName">Stage Name / Artist Name</label>
                    <input type="text" id="stageName" name="stageName" placeholder="e.g. 3H3D, ANDER" required>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="email@domain.com" required>
                </div>
                <div class="col form-group">
                    <label for="phone">Phone / WhatsApp</label>
                    <input type="tel" id="phone" name="phone" placeholder="+62 8..." required>
                </div>
            </div>

            <!-- Role & Genre -->
            <div class="row">
                <div class="col form-group">
                    <label for="role">Primary Role</label>
                    <select id="role" name="role" required>
                        <option value="">-- Select Your Role --</option>
                        <option value="solo_singer">Solo Vocalist / Singer</option>
                        <option value="songwriter">Songwriter</option>
                        <option value="producer">Music Producer / Beatmaker</option>
                        <option value="band_group">Group / Duo / Band</option>
                    </select>
                </div>
                <div class="col form-group">
                    <label for="genre">Primary Genre</label>
                    <input type="text" id="genre" name="genre" placeholder="Pop, Hip-Hop, R&B, Acoustic, etc." required>
                </div>
            </div>

            <!-- Demo Music Link -->
            <div class="form-group">
                <label for="demoUrl">Demo Track Link (Google Drive / Dropbox / SoundCloud)</label>
                <input type="url" id="demoUrl" name="demoUrl" placeholder="https://drive.google.com/..." required>
                <p class="note">*Please ensure link permissions are set to "Public / Anyone with the link".</p>
            </div>

            <!-- Social Media / Portfolio -->
            <div class="form-group">
                <label for="socialMedia">Social Media / Spotify / YouTube Profile</label>
                <input type="text" id="socialMedia" name="socialMedia" placeholder="Instagram / TikTok / YouTube link or username">
            </div>

            <!-- Message / Short Bio -->
            <div class="form-group">
                <label for="message">Short Bio or Track Story</label>
                <textarea id="message" name="message" rows="4" placeholder="Tell us a little bit about yourself or the song you are submitting..."></textarea>
            </div>

            <!-- 3. BAGIAN TOMBOL SUBMIT TERPISAH DI DALAM/AKHIR FORM -->
            <div class="button-container">
                <button type="submit" class="btn-submit">Submit Demo to Ferwap Music</button>
            </div>
        </form>
    </div>

    <div class="footer-text">
        &copy; Ferwap Music Entertainment. All Rights Reserved.
    </div>

</div>

<!-- Link to External JS -->
<script src="script.js"></script>
</body>
</html>
