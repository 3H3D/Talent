<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Submission - Ferwap Music Entertainment</title>
    <!-- Link to External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page-wrapper">

    <!-- 1. BAGIAN LOGO TERPISAH DI ATAS -->
    <div class="logo-section">
        <a href="https://ferwap.com">
        <img src="https://ferwap.com/Ferwap.jpeg" alt="Ferwap Music Logo" style="height: 90px; width: 90px; border-radius: 50%; object-fit: cover; border: 2px solid #ff0000;">
        </a>
        <span class="brand-subtext">FERWAP MUSIC</span>
    </div>

    <!-- 2. KOTAK FORMULIR UTAMA -->
    <div class="form-container">
        <div class="header">
            <h1>Ferwap Music Entertainment</h1>
            <p>Talent Scouting & Demo Submission Portal</p>
        </div>

        <!-- Form terhubung ke Formspree -->
        <form id="talentForm" action="https://formspree.io/f/xbjny..." method="POST">
            
            <!-- Musician Information -->
            <div class="row">
                <div class="col form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Legal Name" required>
                </div>
                <div class="col form-group">
                    <label for="stageName">Artist Name</label>
                    <input type="text" id="stageName" name="stageName" placeholder="Stage Name" required>
                </div>
            </div>

            <div class="row">
                <div class="col form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="email" required>
                </div>
                <div class="col form-group">
                    <label for="phone">Phone / WhatsApp</label>
                    <input type="tel" id="phone" name="phone" placeholder="+62" required>
                </div>
            </div>

            <!-- Role & Genre -->
            <div class="row">
                <div class="col form-group">
                    <label for="role">Primary Role</label>
                    <select id="role" name="role" required>
                        <option value="">-- Select Your Role --</option>
                        <option value="solo_singer">Solo Vocalist</option>
                        <option value="solo_singer">singer</option>
                        <option value="songwriter">Songwriter</option>
                        <option value="producer">Music Producer</option>
                         <option value="producer">Beatmaker</option>
                        <option value="band_group">Group</option>
                        <option value="band_group">Duo</option>
                        <option value="band_group">Band</option>
                    </select>
                </div>
                <div class="col form-group">
                    <label for="genre">Primary Genre</label>
                    <input type="text" id="genre" name="genre" placeholder="Pop, Hip-Hop, R&B, Acoustic, etc." required>
                </div>
            </div>

            <!-- Demo Music Link -->
            <div class="form-group">
                <label for="demoUrl">Demo Track Link</label>
                <input type="url" id="demoUrl" name="demoUrl" placeholder="Google Drive / Dropbox / SoundCloud" required>
                <p class="note">*Please ensure link permissions are set to "Public / Anyone with the link".</p>
            </div>

            <!-- Social Media / Portfolio -->
            <div class="form-group">
                <label for="socialMedia">Social Media</label>
                <input type="text" id="socialMedia" name="socialMedia" placeholder="Instagram / Facebook ">
            </div>

            <!-- Message / Short Bio -->
            <div class="form-group">
                <label for="message">Short Bio</label>
                <textarea id="message" name="message" rows="4" placeholder="Tell us a little bit about yourself or the song you are submitting..."></textarea>
            </div>

            <!-- 3. BAGIAN TOMBOL SUBMIT TERPISAH DI DALAM/AKHIR FORM -->
            <div class="button-container">
                <button type="submit" class="btn-submit">Submit Demo</button>
            </div>
        </form>
    </div>

      <!-- Footer Resmi Label -->
    <footer style="margin-top: 60px; padding: 25px 0; border-top: 1px solid #1f293d; text-align: center; color: #6b7280; font-size: 0.85rem;">
        <p style="margin: 0 0 10px 0;">&copy; 2026 Ferwap Music Entertainment. All rights reserved.</p>
        <div>
            <a href="https://ferwap.com/privacy" style="color: #9ca3af; text-decoration: none; margin: 0 10px;">Privacy Policy</a> | 
            <a href="https://ferwap.com/terms" style="color: #9ca3af; text-decoration: none; margin: 0 10px;">Terms of Service</a> | 
            <a href="https://ferwap.com/copyright" style="color: #9ca3af; text-decoration: none; margin: 0 10px;">copyrightt</a>
        </div>
    </footer>
</div>

<!-- Link to External JS -->
<script src="script.js"></script>
</body>
</html>
