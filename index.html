<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Submission - Ferwap Music Entertainment</title>
    <!-- Link to External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Ferwap Music Entertainment</h1>
        <p>Talent Scouting & Demo Submission Portal</p>
    </div>

    <form id="talentForm" action="#" method="POST">
        
        <!-- Musician Information -->
        <div class="row">
            <div class="col form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="As shown on official ID" required>
            </div>
            <div class="col form-group">
                <label for="stageName">Stage Name / Alias</label>
                <input type="text" id="stageName" name="stageName" placeholder="e.g. 3H3D, ANDER" required>
            </div>
        </div>

        <div class="row">
            <div class="col form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="email@domain.com" required>
            </div>
            <div class="col form-group">
                <label for="phone">Phone / WhatsApp</label>
                <input type="tel" id="phone" name="phone" placeholder="+62 8..." required>
            </div>
        </div>

        <!-- Role & Genre -->
        <div class="row">
            <div class="col form-group">
                <label for="role">Primary Role</label>
                <select id="role" name="role" required>
                    <option value="">-- Select Role --</option>
                    <option value="solo_singer">Solo Vocalist</option>
                    <option value="songwriter">Songwriter</option>
                    <option value="producer">Music Producer / Beatmaker</option>
                    <option value="band_group">Group / Duo / Band</option>
                </select>
            </div>
            <div class="col form-group">
                <label for="genre">Primary Genre</label>
                <input type="text" id="genre" name="genre" placeholder="Pop, Hip-Hop, R&B, etc." required>
            </div>
        </div>

        <!-- Demo Music Link -->
        <div class="form-group">
            <label for="demoUrl">Demo Track Link (Google Drive / Dropbox / SoundCloud)</label>
            <input type="url" id="demoUrl" name="demoUrl" placeholder="https://drive.google.com/..." required>
            <p class="note">*Please ensure link permissions are set to "Public / Anyone with the link".</p>
        </div>

        <!-- Additional Metadata (Optional) -->
        <div class="row">
            <div class="col form-group">
                <label for="isni">ISNI Number (If available)</label>
                <input type="text" id="isni" name="isni" placeholder="0000 0001 ...">
            </div>
            <div class="col form-group">
                <label for="ipi">IPI/CAE Number (If available)</label>
                <input type="text" id="ipi" name="ipi" placeholder="I-000000000-0">
            </div>
        </div>

        <!-- Message / Short Bio -->
        <div class="form-group">
            <label for="message">Short Message / Track Description</label>
            <textarea id="message" name="message" rows="4" placeholder="Briefly describe your track, musical vision, or goals..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Demo to Ferwap Music</button>
    </form>

    <div class="footer-text">
        &copy; Ferwap Music Entertainment. All Rights Reserved & Data Protected.
    </div>
</div>

<!-- Link to External JS -->
<script src="script.js"></script>
</body>
</html>
